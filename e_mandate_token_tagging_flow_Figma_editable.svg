<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L10,3 L0,6 Z" fill="#222"/>
  </marker>
  <style>
    .title{font:700 28px Arial;fill:#112b85}
    .head{font:700 18px Arial;fill:#222}
    .sub{font:12px Arial;fill:#333}
    .label{font:700 12px Arial;fill:#222}
    .small{font:11px Arial;fill:#222}
    .step{font:700 11px Arial;fill:#fff}
  </style>
</defs>

<!-- Title -->
<text x="800" y="35" text-anchor="middle" class="title">E-MANDATE TOKEN TAGGING FLOW (TAG WITHOUT AFA)</text>

<!-- Swimlanes -->
<g fill="#f7fbff" stroke="#4775d1" stroke-width="2"><rect x="20" y="65" width="125" height="875" rx="8"/></g>
<g fill="#f9fff7" stroke="#8bb174" stroke-width="2"><rect x="160" y="65" width="145" height="875" rx="8"/></g>
<g fill="#f7f9ff" stroke="#7192dc" stroke-width="2"><rect x="320" y="65" width="180" height="875" rx="8"/></g>
<g fill="#f7ffff" stroke="#64aeb7" stroke-width="2"><rect x="515" y="65" width="160" height="875" rx="8"/></g>
<g fill="#fbf8ff" stroke="#a080c7" stroke-width="2"><rect x="690" y="65" width="180" height="875" rx="8"/></g>
<g fill="#fffaf3" stroke="#e3b45d" stroke-width="2"><rect x="885" y="65" width="180" height="875" rx="8"/></g>

<!-- Headers -->
<text x="82" y="120" text-anchor="middle" class="head" fill="#183dba">USER</text>
<text x="82" y="140" text-anchor="middle" class="sub">Customer</text>
<text x="82" y="180" text-anchor="middle" class="small">Receives notifications,</text>
<text x="82" y="196" text-anchor="middle" class="small">gives consent,</text>
<text x="82" y="212" text-anchor="middle" class="small">authenticates and</text>
<text x="82" y="228" text-anchor="middle" class="small">checks status</text>

<text x="232" y="120" text-anchor="middle" class="head" fill="#24712e">ISSUER</text>
<text x="232" y="140" text-anchor="middle" class="sub">(Bank)</text>

<text x="410" y="120" text-anchor="middle" class="head" fill="#183dba">TAS</text>
<text x="410" y="140" text-anchor="middle" class="sub">(Token Aggregation System)</text>
<text x="410" y="162" text-anchor="middle" class="label" fill="red">BASE END POINT</text>

<text x="595" y="120" text-anchor="middle" class="head">AEROSPIKE</text>
<text x="595" y="140" text-anchor="middle" class="sub">(In-Memory Store)</text>
<text x="595" y="175" text-anchor="middle" class="small">Stores card details</text>
<text x="595" y="191" text-anchor="middle" class="small">temporarily</text>
<text x="595" y="207" text-anchor="middle" class="small">(epoch based TTL)</text>

<text x="780" y="120" text-anchor="middle" class="head" fill="#7030a0">SIHUB</text>
<text x="780" y="140" text-anchor="middle" class="sub">(Standing Instruction Hub)</text>

<text x="975" y="120" text-anchor="middle" class="head">TSP</text>
<text x="975" y="140" text-anchor="middle" class="sub">(VISA / MASTERCARD)</text>

<!-- Step helper circles -->
<g>
<circle cx="325" cy="255" r="12" fill="#24963c"/><text x="325" y="259" text-anchor="middle" class="step">1</text>
<circle cx="505" cy="300" r="12" fill="#178c8c"/><text x="505" y="304" text-anchor="middle" class="step">1a</text>
<circle cx="505" cy="350" r="12" fill="#183dba"/><text x="505" y="354" text-anchor="middle" class="step">2</text>
<circle cx="875" cy="395" r="12" fill="#7030a0"/><text x="875" y="399" text-anchor="middle" class="step">2a</text>
<circle cx="875" cy="435" r="12" fill="#f4511e"/><text x="875" y="439" text-anchor="middle" class="step">2b</text>
<circle cx="505" cy="480" r="12" fill="#183dba"/><text x="505" y="484" text-anchor="middle" class="step">4</text>
</g>

<!-- Step 1 -->
<line x1="305" y1="255" x2="320" y2="255" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="335" y="247" class="label">POST /tas/token/rebind_id</text>
<text x="335" y="264" class="small">Issuer initiates token mapping with old and new card details</text>

<!-- TAS to Aerospike -->
<line x1="500" y1="300" x2="515" y2="300" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="515" y="288" class="label">Store card details temporarily</text>
<text x="515" y="316" class="small">(epoch based TTL)</text>

<!-- Search old PAN -->
<line x1="500" y1="350" x2="690" y2="350" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="340" class="label">Initiate Search API (Using Old PAN)</text>

<line x1="870" y1="395" x2="885" y2="395" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="385" class="label">Search API (Old PAN)</text>

<line x1="885" y1="435" x2="870" y2="435" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="425" class="label">Search API Response</text>
<text x="700" y="442" class="small">(PAR, TUR, Merchant Name)</text>

<!-- Step 3 / 4 / 5 -->
<line x1="690" y1="460" x2="500" y2="460" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="450" class="label">3. Search API Response (PAR, TUR, Merchant Name)</text>

<line x1="500" y1="480" x2="690" y2="480" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="472" class="label">4. Send PAR</text>

<line x1="690" y1="500" x2="500" y2="500" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="492" class="label">5. E-mandate Tokens (PAR, Merchant Name, etc.)</text>

<!-- Token loop -->
<rect x="500" y="525" width="440" height="225" rx="10" fill="#fbf8ff" stroke="#7030a0" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="512" y="537" width="150" height="38" rx="5" fill="#7030a0"/>
<text x="587" y="553" text-anchor="middle" class="step">For each token (n)</text>
<text x="587" y="568" text-anchor="middle" class="step">One thread per token</text>

<circle cx="512" cy="605" r="12" fill="#183dba"/><text x="512" y="609" text-anchor="middle" class="step">6</text>
<line x1="500" y1="605" x2="690" y2="605" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="530" y="595" class="label">Initiate Search API (E-mandate Token n)</text>

<line x1="870" y1="640" x2="700" y2="640" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="630" class="label">6b. Search API Response</text>
<text x="710" y="647" class="small">Token Unique Reference (TURn)</text>

<line x1="700" y1="685" x2="885" y2="685" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="675" class="label">6c. Token Update API</text>
<text x="710" y="692" class="small">Update eMandate TUR n with New PAN</text>

<line x1="885" y1="720" x2="700" y2="720" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="710" class="label">6d. Update TUR n (with New PAN)</text>

<line x1="700" y1="740" x2="500" y2="740" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="735" class="label">6e. Acknowledgement</text>

<!-- New PAN -->
<circle cx="505" cy="790" r="12" fill="#183dba"/><text x="505" y="794" text-anchor="middle" class="step">7</text>
<line x1="500" y1="790" x2="690" y2="790" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="780" class="label">Initiate Search API (Using New PAN)</text>

<line x1="870" y1="825" x2="700" y2="825" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="815" class="label">7b. Search API Response (PAR)</text>

<line x1="690" y1="850" x2="500" y2="850" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="840" class="label">8. Search API response (PAR)</text>

<line x1="500" y1="875" x2="690" y2="875" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="865" class="label">9. Update (Token, PAR)</text>

<!-- Notification chain -->
<line x1="500" y1="900" x2="1190" y2="900" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="890" text-anchor="middle" class="label">12. Publish Notification (Status / Result)</text>

<!-- Oracle DB -->
<rect x="1180" y="610" width="155" height="95" rx="30" fill="#f6efff" stroke="#8064a2" stroke-width="2"/>
<text x="1257" y="648" text-anchor="middle" class="head" fill="#573a83">ORACLE DB</text>
<text x="1257" y="668" text-anchor="middle" class="small">Mapping Status &amp; Logs</text>

<line x1="870" y1="850" x2="1180" y2="660" stroke="#222" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="1010" y="735" class="small">11. Update Mapping Status / Log</text>

<!-- Kafka -->
<rect x="1180" y="780" width="155" height="100" rx="10" fill="#fff0f0" stroke="#e53935" stroke-width="2"/>
<text x="1257" y="820" text-anchor="middle" class="head" fill="#c62828">KAFKA</text>
<text x="1257" y="842" text-anchor="middle" class="small">Notification Topic</text>

<!-- Required Kafka -> SiHub -->
<line x1="1180" y1="900" x2="870" y2="900" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="1080" cy="900" r="12" fill="#e53935"/><text x="1080" y="904" text-anchor="middle" class="step">13</text>
<text x="1000" y="890" class="label">Notification to SiHub (Status / Result)</text>

<!-- Required SiHub -> TAS -->
<line x1="690" y1="925" x2="500" y2="925" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="650" cy="925" r="12" fill="#e53935"/><text x="650" y="929" text-anchor="middle" class="step">14</text>
<text x="525" y="915" class="label">Notification to TAS (Status / Result)</text>

<!-- TAS -> Issuer -> User -->
<line x1="320" y1="900" x2="305" y2="900" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="890" class="label">15. Notification call to Issuer</text>
<line x1="160" y1="925" x2="145" y2="925" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="915" class="label">16. User receives notification / checks status</text>

<!-- Unique ID -->
<line x1="320" y1="430" x2="305" y2="430" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="170" y="420" class="label">4a. Send Unique ID</text>
<text x="170" y="436" class="small">Old Card / New Card mapping</text>

<!-- Bottom legend -->
<rect x="20" y="965" width="320" height="110" rx="8" fill="white" stroke="#aaa"/>
<text x="35" y="990" class="head" fill="#182c80">LEGEND</text>
<line x1="40" y1="1012" x2="100" y2="1012" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="115" y="1017" class="small">Request / API Call</text>
<line x1="40" y1="1038" x2="100" y2="1038" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="115" y="1043" class="small">Response</text>
<line x1="40" y1="1064" x2="100" y2="1064" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="115" y="1069" class="small">Internal / Store</text>

<!-- Editable note -->
<text x="380" y="1010" class="head" fill="#182c80">STEPS (E-MANDATE FLOW)</text>
<text x="380" y="1032" class="small">1–5: Card rebind, old PAN search, PAR and e-mandate token discovery</text>
<text x="380" y="1050" class="small">6: Per-token TUR search and token update with New PAN</text>
<text x="900" y="1032" class="small">7–9: New PAN search and mapping update</text>
<text x="900" y="1050" class="small">10–16: Consent notification, Kafka → SiHub → TAS → Issuer → User</text>
</svg>